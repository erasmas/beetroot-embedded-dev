; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

; Build environment name. Chosen freely, but it is not just a label: it becomes
; the suffix of the build dir (.pio/build/esp32s3) and of the generated config
; (sdkconfig.esp32s3). Renaming it later orphans both, so it is fixed up front.
[env:esp32s3]

; Development platform: toolchain, framework packages and upload tooling for
; all Espressif 32-bit chips.
platform = espressif32

; Board definition. Sets the target chip (ESP32-S3), the default partition
; table, CPU/flash frequencies and the pin map used by the build.
board = esp32-s3-devkitc-1

; Framework. 'espidf' gives the native Espressif SDK in C (FreeRTOS + drivers).
; Without this option PlatformIO silently defaults to 'arduino' (C++).
framework = espidf

; N16R8: 16 MB flash, 8 MB octal PSRAM (no stock board def for this combo).
; The stock esp32-s3-devkitc-1 definition assumes 8 MB flash, so both the
; compiled image and the flashing step have to be told the real size.

; Flash size the firmware is built against — drives the partition table layout.
board_build.flash_size = 16MB

; Flash size esptool writes into the image header at upload time. Must match
; the line above, otherwise the bootloader may refuse to start the app.
board_upload.flash_size = 16MB

; Serial baud rate of the monitor. Must match the IDF console speed (115200 by
; default) or the log output comes through as garbage.
monitor_speed = 115200

; Serial port used for flashing. The board exposes two USB interfaces (the
; CH34x UART bridge and the chip's native USB), so autodetection often picks
; the wrong one; the glob pins it to the CH34x bridge.
upload_port = /dev/cu.usbmodem*

; Serial port used by the monitor. Kept identical to upload_port so that
; `pio run -t upload -t monitor` stays on one interface.
monitor_port = /dev/cu.usbmodem*

; Post-processes the monitor stream: on a panic, translates the raw backtrace
; addresses into function names and file:line using the ELF file.
monitor_filters = esp32_exception_decoder
